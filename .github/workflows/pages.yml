name: Deploy demo site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-data.mjs'
      - 'scripts/build-docs.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Allow one concurrent deployment, and let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The generated HTML is committed so docs/ can be opened locally, but it is
      # regenerated here so a forgotten `bun run docs:build` cannot ship a page
      # that disagrees with scripts/docs-data.mjs.
      - run: node ./scripts/build-docs.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

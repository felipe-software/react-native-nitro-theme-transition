// Gradle module for the Android half of @repo/theme-transition.
//
// No `buildscript { }` block on purpose: the Android and Kotlin plugins are
// already on the root project's classpath (see apps/mobile/android/build.gradle),
// and pinning our own versions here is how a library ends up fighting the app's.

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

/*
 * The `com.facebook.react` plugin is deliberately NOT applied.
 *
 * It exists to run React Native's codegen over a package's `codegenConfig`, and
 * this package has none: the bridge is generated by nitrogen, and the Kotlin it
 * produces is wired in by the `apply from:` below.
 *
 * Applied here it does active harm. With no `codegenConfig` to work from it
 * falls back to app-mode behaviour and scans the project directory's
 * `node_modules` for every library's specs, generating them into THIS module's
 * AAR. In a consumer install there is no nested `node_modules` so nothing
 * happens — but when the example builds the library straight from the repo (see
 * `example/react-native.config.js`), the repo's own `node_modules` is right
 * there, and the duplicated classes fail the app's dex merge:
 *
 *   Type com.facebook.react.viewmanagers.RNGestureHandlerButtonManagerDelegate
 *   is defined multiple times
 */

// Adds nitrogen's generated Kotlin to the source set.
apply from: '../nitrogen/generated/android/NitroThemeTransition+autolinking.gradle'

android {
  namespace "com.margelo.nitro.nitrothemetransition"
  compileSdkVersion safeExtGet('compileSdkVersion', 36)

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 24)

    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  buildFeatures {
    // Required for `find_package(ReactAndroid)` / `find_package(fbjni)` in CMake.
    prefab true
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  packagingOptions {
    // These all ship with the app already; bundling a second copy in this AAR
    // makes the linker pick between duplicates at runtime.
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libjsi.so",
      "**/libc++_shared.so",
      "**/libreactnative.so",
      "**/libreact_nativemodule_core.so",
      "**/libturbomodulejsijni.so",
      "**/libfbjni.so",
    ]
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation 'com.facebook.react:react-native'
  implementation project(":react-native-nitro-modules")
}
